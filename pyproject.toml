[project]
name = "gamegene"
version = "0.1.0"
description = "Game Gene Agent: evidence-gated Steam game recommendations by design genes (SYE 6602 course project)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "httpx>=0.27",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "gradio>=5.0,<6",
    "fastapi>=0.110",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.7"]

[project.scripts]
gamegene = "gamegene.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamegene"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "dev_a: acceptance tests owned by Dev A (data side)",
    "dev_b: acceptance tests owned by Dev B (recommendation side)",
    "live: hits real network or a paid API; never runs in CI",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
